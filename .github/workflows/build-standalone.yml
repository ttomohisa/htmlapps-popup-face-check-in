name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Test history and registration behavior
        run: node --test tests/*.test.cjs
      - name: Download pinned runtime and models
        shell: pwsh
        run: ./scripts/setup-assets.ps1
      - name: Check repository
        shell: pwsh
        run: ./scripts/check-repository.ps1 -SkipBuild
      - name: Build and verify standalone HTML
        shell: pwsh
        run: ./build-standalone.ps1
      - name: Verify standalone HTML
        shell: pwsh
        run: ./scripts/verify-standalone.ps1
      - name: Test header normalization
        run: node ./tests/header-normalization.test.mjs src/index.template.html dist/index.html
      - name: Test Help dismissal
        run: node ./tests/help-dialog.test.cjs src/index.template.html dist/index.html
      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: standalone-html-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/index.html
            dist/build-size-report.json
          if-no-files-found: error
          retention-days: 14
