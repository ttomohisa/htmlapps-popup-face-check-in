name: Deploy standalone app to GitHub Pages

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Download pinned runtime and models
        shell: pwsh
        run: ./scripts/setup-assets.ps1
      - name: Check repository
        shell: pwsh
        run: ./scripts/check-repository.ps1 -SkipBuild
      - name: Build standalone HTML
        shell: pwsh
        run: ./build-standalone.ps1
      - name: Verify standalone HTML
        shell: pwsh
        run: ./scripts/verify-standalone.ps1
      - name: Test header normalization
        run: node ./tests/header-normalization.test.mjs src/index.template.html dist/index.html
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
