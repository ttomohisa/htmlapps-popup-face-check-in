name: Bug report
description: Report reproducible incorrect behavior
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Open...
        2. Select...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and version
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and OS
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors or sample file
      description: Remove face data, names, and other sensitive data before attaching anything.
